# Release of conductor-sync on a tag vX.Y.Z (or vX.Y.Z-rc.N): the quality gates,
# .deb and .rpm packages for amd64/x86_64 and arm64/aarch64 (cross-compiled,
# CGO off) and the noarch SELinux policy package, arm64 smoke runs under QEMU
# (Debian 13 and Fedora 44), an independent rebuild that must be byte-identical, SBOMs,
# SHA256SUMS and its OpenPGP signature. Once the repository is public:
# GitHub artifact attestations (build provenance, SBOM) and a Sigstore
# bundle. A draft GitHub release only when the repository variable
# PUBLISH_RELEASE is "true". Keys and settings the maintainers provide:
# https://github.com/openbasalt/samba-conductor-docs/blob/main/verifying-releases.md. Actions are pinned by commit SHA.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-sync
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-sync/go.mod
          cache-dependency-path: conductor-sync/go.sum
      - name: gofmt, vet, staticcheck, govulncheck, go test -race
        working-directory: conductor-sync
        run: make check

  package:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-sync
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-sync/go.mod
          cache-dependency-path: conductor-sync/go.sum
      - name: Packages (deb and rpm, amd64 and arm64), SELinux policy, SBOMs
        working-directory: conductor-sync
        run: make package
      - name: lintian (Debian 13)
        working-directory: conductor-sync
        run: make lintian
      - name: rpmlint (Fedora 44)
        working-directory: conductor-sync
        run: make rpmlint
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: arm64 smoke (install and run under QEMU)
        working-directory: conductor-sync
        run: packaging/smoke.sh deb arm64
      - name: aarch64 RPM smoke (install and run under QEMU, Fedora 44)
        working-directory: conductor-sync
        run: packaging/smoke.sh rpm arm64
      - name: SHA256SUMS
        working-directory: conductor-sync/dist
        run: sha256sum -- *.deb *.rpm *.cdx.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: conductor-sync/dist/
          retention-days: 30

  reproduce:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-sync
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-sync/go.mod
          cache-dependency-path: conductor-sync/go.sum
      - name: Rebuild
        working-directory: conductor-sync
        run: make package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Same bytes as the release build
        working-directory: conductor-sync/dist
        run: sha256sum -c "$GITHUB_WORKSPACE/release/SHA256SUMS"

  sign:
    needs: reproduce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Protected environment (tags only, required reviewer): holds the
    # release signing subkey. Without the secret the job only records that
    # the release is unsigned.
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: OpenPGP signature of SHA256SUMS
        working-directory: release
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
          SIGNING_FPR: ${{ vars.RELEASE_SIGNING_FPR }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set: SHA256SUMS is not signed"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          printf '%s' "$SIGNING_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$SIGNING_FPR" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed
          path: release/
          retention-days: 30

  attest:
    # Attestations and Sigstore publish the repository and workflow identity
    # in public logs, and private repositories need GitHub Enterprise for
    # attestations: only once the repository is public.
    if: ${{ github.event.repository.private == false }}
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
      - name: One SBOM path per package
        run: |
          cp release/*_amd64.cdx.json "$RUNNER_TEMP/sbom-amd64.cdx.json"
          cp release/*_arm64.cdx.json "$RUNNER_TEMP/sbom-arm64.cdx.json"
          cp release/*[0-9].x86_64.cdx.json "$RUNNER_TEMP/sbom-x86_64.cdx.json"
          cp release/*[0-9].aarch64.cdx.json "$RUNNER_TEMP/sbom-aarch64.cdx.json"
          cp release/*-selinux-*.noarch.cdx.json "$RUNNER_TEMP/sbom-selinux.cdx.json"
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/*_amd64.deb
          sbom-path: ${{ runner.temp }}/sbom-amd64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/*_arm64.deb
          sbom-path: ${{ runner.temp }}/sbom-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/*[0-9].x86_64.rpm
          sbom-path: ${{ runner.temp }}/sbom-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/*[0-9].aarch64.rpm
          sbom-path: ${{ runner.temp }}/sbom-aarch64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/*-selinux-*.noarch.rpm
          sbom-path: ${{ runner.temp }}/sbom-selinux.cdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sigstore bundle of SHA256SUMS (keyless)
        working-directory: release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attested
          path: release/
          retention-days: 30

  draft-release:
    if: ${{ vars.PUBLISH_RELEASE == 'true' }}
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed
          path: release
      - name: Draft GitHub release (published by a person)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "conductor-sync $TAG" --notes "Packages, SBOMs and signed checksums of conductor-sync $TAG." release/*
