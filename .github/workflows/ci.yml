# Continuous integration of conductor-sync: the quality gates, then the packages
# (.deb and .rpm for amd64/x86_64 and arm64/aarch64, cross-compiled with CGO
# off, and the noarch SELinux policy package built in a Fedora 44
# container) checked by Debian 13's lintian and Fedora 44's rpmlint. Actions are pinned by commit SHA. Release builds: release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOPRIVATE: github.com/openbasalt/*

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The sibling modules (github.com/openbasalt/samba-conductor-*) are
      # private until the repositories are opened: the go command fetches the
      # versions go.mod pins straight from GitHub (GOPRIVATE, set for the workflow) with a
      # read-only token from the org's GitHub App (planning/docs/packaging.md,
      # "CI access to the sibling repositories"). When the repositories are
      # public, this step, the git credentials step and GOPRIVATE go away.
      - name: Token for the sibling repositories
        id: siblings
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SIBLINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIBLINGS_APP_PRIVATE_KEY }}
          owner: openbasalt
          repositories: samba-conductor-ad
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-sync
          fetch-depth: 0
          persist-credentials: false
      - name: Git credentials for the sibling modules (read-only, this job only)
        env:
          TOKEN: ${{ steps.siblings.outputs.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/openbasalt/".insteadOf "https://github.com/openbasalt/"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-sync/go.mod
          cache-dependency-path: conductor-sync/go.sum
      - name: Pinned gate tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: gofmt, vet, staticcheck, govulncheck, go test -race
        working-directory: conductor-sync
        run: make check

  package:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The sibling modules (github.com/openbasalt/samba-conductor-*) are
      # private until the repositories are opened: the go command fetches the
      # versions go.mod pins straight from GitHub (GOPRIVATE, set for the workflow) with a
      # read-only token from the org's GitHub App (planning/docs/packaging.md,
      # "CI access to the sibling repositories"). When the repositories are
      # public, this step, the git credentials step and GOPRIVATE go away.
      - name: Token for the sibling repositories
        id: siblings
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SIBLINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIBLINGS_APP_PRIVATE_KEY }}
          owner: openbasalt
          repositories: samba-conductor-ad
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-sync
          fetch-depth: 0
          persist-credentials: false
      - name: Git credentials for the sibling modules (read-only, this job only)
        env:
          TOKEN: ${{ steps.siblings.outputs.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/openbasalt/".insteadOf "https://github.com/openbasalt/"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-sync/go.mod
          cache-dependency-path: conductor-sync/go.sum
      - name: Packages (deb and rpm, amd64 and arm64), SELinux policy, SBOMs
        working-directory: conductor-sync
        run: make package
      - name: lintian (Debian 13)
        working-directory: conductor-sync
        run: make lintian
      - name: rpmlint (Fedora 44)
        working-directory: conductor-sync
        run: make rpmlint
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conductor-sync-packages
          path: conductor-sync/dist/
          retention-days: 7
