# Continuous integration of conductor-sync: the quality gates, then the packages
# (.deb and .rpm for amd64/x86_64 and arm64/aarch64, cross-compiled with CGO
# off, and the noarch SELinux policy package built in a Fedora 44
# container) checked by Debian 13's lintian and Fedora 44's rpmlint, and the
# arm64 packages installed and run under QEMU (the release workflow's smoke).
# Actions are pinned by commit SHA. Release builds: release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs on main (for example after a change of the CI App or its
  # settings, when there is no new commit to push).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-sync
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-sync/go.mod
          cache-dependency-path: conductor-sync/go.sum
      - name: gofmt, vet, staticcheck, govulncheck, go test -race
        working-directory: conductor-sync
        run: make check

  package:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-sync
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-sync/go.mod
          cache-dependency-path: conductor-sync/go.sum
      - name: Packages (deb and rpm, amd64 and arm64), SELinux policy, SBOMs
        working-directory: conductor-sync
        run: make package
      - name: lintian (Debian 13)
        working-directory: conductor-sync
        run: make lintian
      - name: rpmlint (Fedora 44)
        working-directory: conductor-sync
        run: make rpmlint
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: arm64 smoke (install and run under QEMU)
        working-directory: conductor-sync
        run: packaging/smoke.sh deb arm64
      - name: aarch64 RPM smoke (install and run under QEMU, Fedora 44)
        working-directory: conductor-sync
        run: packaging/smoke.sh rpm arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conductor-sync-packages
          path: conductor-sync/dist/
          retention-days: 7
